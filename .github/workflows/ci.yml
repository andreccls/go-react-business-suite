name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password   # throw-away service container, CI only
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: postgres://ci:ci_only_password@127.0.0.1:5432/ci?sslmode=disable
      REQUIRE_DB: "1"   # a skipped integration suite must fail the build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format, vet, staticcheck
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          staticcheck ./...
      - name: Tests (race, PostgreSQL integration, concurrency) + coverage gates
        run: |
          go test -race -count=1 \
            -coverpkg="$(go list ./internal/... | grep -v -e /testdb -e /repotest | paste -sd, -)" \
            -coverprofile=coverage.out ./...
          sh scripts/coverage-gate.sh coverage.out
      - name: Coverage summary
        if: always()
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the distroless image
        run: docker build -t studio-suite-api backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Lint (ESLint, jsx-a11y) and typecheck (tsc strict)
        run: |
          npm run lint
          npm run typecheck
      - name: Generated API types are up to date with backend/internal/httpapi/openapi.json
        run: npm run check:api
      - name: Tests with coverage gate (thresholds live in vite.config.ts)
        run: npm run coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| metric | % |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Production build
        run: npm run build

  # Builds every image and runs the Playwright flow (login -> service/customer -> booking -> 409 -> dashboard)
  # against the FULL stack: nginx + API + PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Playwright (official image, on the compose network)
        run: ./e2e/run.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v
