# SPA + same-origin proxy to the Go API. Runs unprivileged (port 8080).

# Hide the nginx version.
server_tokens off;

# Compress text assets (the SPA bundle compresses ~3x).
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSP for the SPA: everything from this origin only. No inline script, no inline <style>, no CDN.
    # (React sets style properties through the CSSOM, which style-src 'self' allows.)
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # The API (and its Swagger UI at /api/docs/): the trailing slash on proxy_pass strips the /api prefix.
    # The API sets its own headers for its responses; we only add the generic hardening ones.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Hashed build output: cache forever; a missing file is a real 404, not the SPA shell.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is a client-side route: serve the shell, never cache it.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
