# Local development stack. All passwords below are DEVELOPMENT-ONLY defaults.
name: ${COMPOSE_PROJECT_NAME:-grbs}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_postgres_password}
      POSTGRES_DB: suite
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suite -d suite"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://suite:${POSTGRES_PASSWORD:-dev_only_postgres_password}@postgres:5432/suite?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789abcdef}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-admin-password}
      BUSINESS_TZ: ${BUSINESS_TZ:-America/Sao_Paulo}
      # Dev: the React dev server (Vite) runs on another origin. In production the
      # frontend is served by nginx, which proxies /api to this service: no CORS needed.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8095}:8080"
    # distroless has no shell/curl: the binary probes itself (`/api -healthcheck`).
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  # --- Stage 2 (not implemented yet): React frontend served by nginx, proxying /api ---
  # frontend:
  #   build: ./frontend
  #   depends_on: [api]
  #   ports:
  #     - "127.0.0.1:${WEB_PORT:-8096}:80"

  # Go toolchain used by the Makefile (no Go needed on the host).
  tools:
    build:
      context: ./backend
      target: dev
    profiles: ["tools"]
    working_dir: /src
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://suite:${POSTGRES_PASSWORD:-dev_only_postgres_password}@postgres:5432/suite?sslmode=disable
      REQUIRE_DB: "1"
      GOFLAGS: -buildvcs=false
    volumes:
      - ./backend:/src
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

volumes:
  pgdata:
  gocache:
  gomod:
